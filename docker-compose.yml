# docker-compose.yml
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventbridge_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventbridge-net

  orchestrator:
    build:
      context: ./orchestrator-service
    container_name: eventbridge_orchestrator
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    networks:
      - eventbridge-net

  api_gateway:
    build:
      context: ./api_gateway_service
    container_name: eventbridge_api_gateway
    ports:
      - "8000:8000"
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    networks:
      - eventbridge-net

  redis:
    image: redis:7-alpine
    container_name: eventbridge_redis
    ports:
      - "6379:6379"
    networks:
      - eventbridge-net

  excel_report_service:
    build:
      context: ./excel_report_service
    container_name: eventbridge_excel_report
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REPORT_FILE: /reports/events_report.xlsx
      BUFFER_SIZE: 10
      BUFFER_FLUSH_INTERVAL: 30
      PYTHONUNBUFFERED: 1
    volumes:
      - ./excel_reports:/reports  
    networks:
      - eventbridge-net
    restart: unless-stopped

  pdf_ticket_service:
    build:
      context: ./pdf_ticket_service
    container_name: eventbridge_pdf_ticket
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      PDF_SERVER_HOST: 0.0.0.0
      PDF_SERVER_PORT: 8080
      PDF_OUTPUT_DIR: /app/generated_tickets
      PYTHONUNBUFFERED: 1
    volumes:
      - ./pdf_ticket_service/generated_tickets:/app/generated_tickets
    networks:
      - eventbridge-net
    restart: unless-stopped

  slack_integration:
    build:
      context: ./slack_integration
    container_name: eventbridge_slack
    depends_on:
      rabbitmq:
        condition: service_healthy
      pdf_ticket_service:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      PDF_SERVICE_BASE_URL: http://pdf_ticket_service:8080
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/your/webhook/url}
      PYTHONUNBUFFERED: 1
    networks:
      - eventbridge-net
    restart: unless-stopped

networks:
  eventbridge-net:
    driver: bridge
