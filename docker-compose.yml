version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventbridge_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventbridge_redis
    ports:
      - "6379:6379"

  pdf_ticket_service:
    build: ./pdf_ticket_service
    container_name: eventbridge_pdf
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      PDF_OUTPUT_DIR: /app/generated_tickets
      PDF_SERVER_HOST: "0.0.0.0"
      PDF_SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ticket_pdfs:/app/generated_tickets
    restart: unless-stopped

  slack_integration:
    build: ./slack_integration
    container_name: eventbridge_slack
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      SLACK_QUEUE_NAME: registration_events
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?err}
      PDF_SERVICE_BASE_URL: http://pdf_ticket_service:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  ticket_pdfs:
